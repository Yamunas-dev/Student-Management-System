<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Student · StudentHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('students')}"></div>

<div class="page-wrap" style="padding-top: 48px;">
    <div class="form-card">
        <h2>Edit Student</h2>
        <p class="lede">Update the details for this student record.</p>

        <form th:action="@{/students/save}" th:object="${student}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="field-row">
                <div class="field">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" th:field="*{studentName}" required>
                </div>
                <div class="field">
                    <label for="rollNumber">Roll Number</label>
                    <input type="text" id="rollNumber" th:field="*{rollNumber}" required>
                </div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="department">Department</label>
                    <input type="text" id="department" th:field="*{department}" required>
                </div>
                <div class="field">
                    <label for="semester">Semester</label>
                    <input type="text" id="semester" th:field="*{semester}" required>
                </div>
            </div>

            <div class="field-row">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}" required>
                </div>
            </div>

            <div class="field">
                <label for="cgpa">CGPA</label>
                <input type="number" id="cgpa" th:field="*{cgpa}" step="0.01" min="0" max="10" required>
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" th:field="*{address}"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-brass">Update Student</button>
                <a th:href="@{/students}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
