<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

                <path d="M16 5L28 11L16 17L4 11L16 5Z" fill="white" fill-opacity="0.9"/>

            <span>StudentHub</span>
        </a>
        <div class="nav-links">
            <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active' : ''">Dashboard</a>

    </div>

</html>
